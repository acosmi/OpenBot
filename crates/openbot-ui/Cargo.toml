[package]
name = "openbot-ui"
description = "Leptos CSR/WASM（v3 §5.1 / §13.1；视觉真源 = 设计系统文档）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.leptos-i18n]
default = "en"
locales = ["en", "zh-CN"]
locales-dir = "locales"

[package.metadata.openbot-ui]
generated-assets = ["design/tokens.css"]

[lints]
workspace = true

[dependencies]
openbot-contracts.workspace = true
serde_json.workspace = true
time.workspace = true
leptos.workspace = true
leptos_router.workspace = true
leptos_meta.workspace = true
leptos_i18n.workspace = true

# G6 has started. Remaining transcript-only pins (pulldown-cmark/syntect) land with the first
# markdown consumer rather than as zero-call dependencies.

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-net.workspace = true
js-sys.workspace = true
wasm-bindgen-futures.workspace = true
web-sys.workspace = true

[build-dependencies]
leptos_i18n_build.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true

[dev-dependencies]
toml.workspace = true
