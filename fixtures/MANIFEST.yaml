  - id: db-seed-0012
    upstream: "-"
    label: 新增
    target: fixtures/db/seed-0012.sql -> openbot_infra::db::tables
    owner: openbot-infra
    test_id: T-FIX-0028
    migration_rule: "n/a: 上游没有对抗性数据集，这是为验证类型映射保真而新造的"
    status: done
    evidence: "psql -v ON_ERROR_STOP=1 应用到由 13 条 migration 建成的库，28 张表各 6 行共 168 行全部落库；集成测试 every_seeded_row_decodes_through_its_row_struct 与 adversarial_values_survive_the_round_trip_intact 对真库跑绿"
    done_evidence: "fixtures/db/seed-0012.sql（171 行 INSERT，外键拓扑序）；生成器带覆盖率断言，7 个值池 + 4 个 enum 的每一项都至少出现一次，缺一即判红"
    notes: >-
      目的不是"有数据"，而是专挑会让类型映射悄悄出错的值：空串 vs NULL、空数组 vs 含 NULL 元素的数组、
      jsonb 里超 f64 精度的整数 9007199254740993、timestamptz 亚秒 + 非 UTC 偏移、
      CJK / emoji / 组合字符 / 引号 / 反斜杠 / 换行制表 / RTL、boolean 的 false、integer 的 0 / 负数 / i32::MAX、
      以及 4 个 enum 的每一个取值（credential_kind 有 6 个）。
      两条实测记录，避免后人误以为它测了没测的东西：
      (1) jsonb 键序**测不了** —— PostgreSQL 的 jsonb 按定义无序，写入 {"b":1,"a":2} 读出来就是 {"a":2,"b":1}；
      (2) 最初每表只 3 行时，值池里 emoji / 组合字符 / 反斜杠 / 含 NULL 元素的数组全都从未出现，
      是覆盖率断言把这个洞照出来的，行数因此提到 6（最大的 enum credential_kind 有 6 个值，少于 6 不可能全覆盖）。
      它同时是 openbot-infra 那条 text[] -> Vec<Option<String>> 映射修正的触发者：Vec<String> 在 {NULL,x} 上当场判红。

