      验收判据：两种情况都能靠 (aggregate_id, seq, destination) 去重恢复到同一终态；不产生重复的外部 effect（v3 §4.3 条 5）。
      阻塞原因：openbot-application 与 openbot-testkit 均为空骨架。
      解除条件：G1（Rust Core 与 PostgreSQL）之后、G3 之前。

