    notes: >-
      需录：navigate、snapshot、read、click、type、key、scroll、screenshot、screencast(start/stop/ack)、human input、secret insert、profile lifecycle(ensure/stop/reset) 每个成员一组请求 / 响应样本。
      录制前提：需要能起上游 agent-computer（Playwright + 浏览器）并对它发命令；本仓的 Rust engine 尚不存在。
      验收判据：样本覆盖的 operation 集合与 Rust 侧封闭 enum 的成员集合**逐字相等**（多一个少一个都红）；
      "没有 download/upload"本轮已在固定 commit 上复算并加了正向对照：`setInputFiles` / `filechooser` / `fileChooser` / `waitForEvent` / `suggestedFilename` / `saveAs` / `acceptDownloads` / 字面量 'download' 在 agent-computer/src、server/src、app/src、worker、supervisor、shared 下命中数全为 0；
      正向对照 `.goto(`=1 / `.click(`=3 / `.screenshot(`=1 / `.on(`=6（agent-computer/src，grep -F 计数）证明同一条 grep 能找到这类代码。
      但 v3 §11.2 里逐字写的 `page.on` 那一项是**弱证据**：上游 Playwright 的 Page 变量叫 `target` 不叫 `page`（agent-computer/src/index.ts 里是 `target.goto(...)`），所以 `page.on = 0` 在"有 page.on 但换了变量名"的世界里同样为真。
      本条采信的是按 API 名的那七项，`page.on` 只作参考；建议同 PR 把 §11.2 的复算命令换成按 API 名的版本。
      阻塞原因：本机未安装上游依赖（bun install 未跑，Playwright 浏览器未下载），且 openbot-computer 是空骨架。
      解除条件：在一台能跑上游 agent-computer 的机器上按 29 条手写路径逐条录制，或在 openbot-computer 的 engine 落地后由它自录。
