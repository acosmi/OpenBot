# OpenBot CI —— 编排依据 = v3 §16.3〈Supply chain〉的固定清单 + v3 §19.3 的 parity 闸门。
#
# 2026-08-24 用户明确要求停止消耗 GitHub Actions 额度：自动 `pull_request` / `push`
# 触发关闭，只保留显式 `workflow_dispatch`。没有用户再次授权，不得手动派发；日常验证
# 改在本机运行定向测试。此前 W-7c 的 Ubuntu 24.04 x86_64 成功证据仍是有效历史证据。

name: CI

on:
  workflow_dispatch:
    inputs:
      run_supply_chain:
        description: "是否跑 supply-chain job（cargo deny / audit / vet，比 gates 慢）"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # 编译器版本不在这里钉 —— 仓根 rust-toolchain.toml 是唯一真源（CLAUDE.md §3）。
  # 在 workflow 里再写一遍版本号 = 第二个真源 = 迟早漂移。

# 用到的三个 action 的 major 版本，2026-08-22 用
#   gh api repos/<owner>/<repo>/releases/latest --jq .tag_name
# 实查过，不是凭印象写的：
#   actions/checkout        v7.0.1
#   Swatinem/rust-cache     v2.9.2
#   taiki-e/install-action  v2.86.5
# 注：W-7c 已在 GitHub Actions 上得到 Ubuntu 24.04 x86_64 两 job 全绿的历史证据；
# 当前 manual-only 是用户的额度控制指令，不是对该证据的撤销。

jobs:
  # =========================================================================
  # gates —— v3 §16.3 固定清单的前三条 + v3 §19.3 的 parity 闸门。
  # 与本机 `cargo xtask ci` **同一份判据、同一个顺序**：本机绿 ≠ CI 绿的差异只能来自环境，
  # 不能来自"两边跑的命令不一样"。
  # =========================================================================
  gates:
    name: gates（fmt / clippy / test / native guards / parity）
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1

      - name: 安装 SAML xmlsec 原生闭包
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libxmlsec1-dev libxmlsec1-openssl libclang-dev pkg-config libssl-dev ripgrep
          xmlsec1-config --version
          pkg-config --modversion libxml-2.0 openssl
          rg --version

      - name: 安装 rust-toolchain.toml 钉住的工具链
        # rustup 读仓根 rust-toolchain.toml（channel + rustfmt/clippy components）。
        # `rustup show` 会触发安装并把实际版本打进日志 —— 判红时第一件事就是看这一行，
        # 确认两边编译器是同一个。
        run: rustup show

      - name: 记录版本（判红时的第一手证据）
        run: |
          rustc --version
          cargo --version
          cargo fmt --version
          cargo clippy --version

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: gates

      # 顺序与 v3 §16.3 逐条对应。
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy --all-targets --all-features -D warnings
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo test --locked
        # --locked：Cargo.lock 必须已提交且与 Cargo.toml 一致（v3 §16.3）。
        # lock 不同步时这一步会直接失败，而不是静默改写 lock 后继续。
        run: cargo test --workspace --all-features --locked

      - name: W-7 safe dialer dependency / C-FFI guard
        # 精确锁定 rustls/ring feature、唯一 socket 调用面、ring build.rs hash、38 Perl、
        # 17 个预生成对象与 20 条诚实的非审计 exemption；任一漂移先红再 delta audit。
        run: bash tools/check-safe-dialer-dependencies.sh

      - name: W-7b SAML / xmlsec / OpenSSL / libxml2 FFI guard
        run: bash tools/check-saml-dependencies.sh

      - name: xtask parity-check
        # v3 §19.3："CI 拒绝未归类项和没有证据的 `done`"。
        # parity/ 为空时它打印 "0 ledger" 并通过 —— Phase 0 早期这是正确行为，
        # 不是漏检：ledger 还没被生成出来，没有可判定的对象。
        run: cargo xtask parity-check

  # =========================================================================
  # supply-chain —— v3 §16.3 里能在本仓当前状态下真跑起来的那几条。
  # 拆成独立 job 是因为它要联网拉 advisory-db，失败原因与代码质量无关，
  # 混进 gates 会让"闸门为什么红"这个问题多一个来源。
  # =========================================================================
  supply-chain:
    name: supply-chain（cargo deny / cargo audit / cargo vet）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ inputs.run_supply_chain }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: 安装 SAML xmlsec 原生闭包
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libxmlsec1-dev libxmlsec1-openssl libclang-dev pkg-config libssl-dev ripgrep
          xmlsec1-config --version
          rg --version

      - name: 安装 rust-toolchain.toml 钉住的工具链
        run: rustup show

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: supply-chain

      - name: 安装钉版 supply-chain 工具
        uses: taiki-e/install-action@v2.86.5
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2,cargo-vet@0.10.0

      - name: RUSTSEC waiver reachability guard
        # 豁免不只是 ignore 字符串：先锁定可达性前提，变了就先红。
        run: bash tools/check-rustsec-waivers.sh

      - name: W-7 safe dialer dependency / C-FFI guard
        run: bash tools/check-safe-dialer-dependencies.sh

      - name: W-7b SAML / xmlsec / OpenSSL / libxml2 FFI guard
        run: bash tools/check-saml-dependencies.sh

      - name: cargo deny（licenses / bans / advisories / sources 四段）
        # 配置 = 仓根 deny.toml；RUSTSEC-2023-0071 的书面裁决与触发器同样在该文件。
        run: cargo deny check

      - name: cargo audit / RustSec
        # 与 cargo deny 的 advisories 段判据重叠但不等价（audit 直读 Cargo.lock，
        # deny 走依赖图）。v3 §16.3 把两者并列，这里照列，不合并。
        # cargo-audit 不读 deny.toml，同一条裁决必须显式传入；其余 advisory 仍全部判红。
        run: cargo audit --deny warnings --ignore RUSTSEC-2023-0071

      - name: cargo vet（锁定 imports 与 exemptions 棘轮）
        # --locked 不拉取漂移的远程 audits；只读入库 imports.lock。
        # Cargo.lock 新增/升级的未覆盖版本必须判红，不自动生成 exemption。
        run: cargo vet --locked

# ===========================================================================
# v3 §16.3 固定清单里**尚未接线**的条目（status: todo）
# ===========================================================================
# 下面这些刻意**没有**写成 job。理由：它们各自缺一份本仓此刻还不存在的基线，接进来就是一条
# 恒红的闸门 —— 而一条恒红的闸门等于没有闸门（它会训练所有人忽略红色）。
# 每条都写明阻塞原因与解除条件，G0 收口时逐条勾掉。cargo vet 已由 R45 解除：
# 钉 cargo-vet 0.10.0，Google exact/delta imports 入锁，CI 跑 `cargo vet --locked`。
#
# 1. OSV scan（Electron shim / packaged assets）
#    阻塞：Electron shim 与打包资产在 G6/G8 才存在（v3 §16.2），此刻没有扫描对象。
#    解除：`components/` 下出现 shim 源码与 lockfile 之后接 `osv-scanner`。
#
# 2. secret scan
#    阻塞：需要先选定工具（gitleaks / trufflehog）与 allowlist 基线，否则会被 fixture 里的
#          假 token 刷屏。注：.gitignore 已挡住 .env / *.pem 这一层，但那是预防不是扫描。
#    解除：G0 产出 `fixtures/**` 之后，连同 fixture 里"哪些看起来像密钥的字符串是假的"
#          一起定 allowlist。
#
# 3. license / NOTICE / provenance verification
#    阻塞：`provenance/sources.spdx.json`、`NOTICE`、`LICENSE` 已在，但还没有可执行的一致性校验器。
#    解除：接一个比对"复用文件的 source repo / commit / original path / license /
#          copyright / modified flag / hash"是否与实际一致的校验步。
#
# 4. CycloneDX / SPDX SBOM
#    阻塞：无 —— 技术上现在就能跑（cargo-cyclonedx）。不接的理由是产物无人消费：
#          SBOM 要与第 3 条的 provenance 校验和第 6 条的签名一起才构成完整证据链。
#    解除：与第 3 条同 PR 接入。
#
# 5. reproducibility check（可复现构建）
#    阻塞：需要两次独立构建的字节比对基线，且发行物形态（v3 §16.1/§16.2）尚未定型。
#    解除：G8 定下发行物清单后接入。
#
# 6. artifact signature / provenance verification
#    阻塞：签名密钥与 release environment 尚未建立。
#    解除：G8 建立 release 边界后接入。
#
# ===========================================================================
# GUI 闸门（CLAUDE.md §10 "GUI 另加" / 设计系统文档 §15）—— G6 起接线
# ===========================================================================
# `cargo test -p openbot-ui` · `xtask i18n-check` · `xtask design-lint` · `xtask css-check` ·
# `xtask bundle-budget` · golden 截图（Web 110 张 / Desktop 每平台 54 张，差异像素 ≤ 0.1%
# 且无 8×8 全差异块）· CDP AX 树检查。
#
# 阻塞：`crates/openbot-ui` 在 Phase 0 连 leptos 依赖都刻意没引（不编 WASM），
#       上面每一条的判据对象都不存在。
# 解除：G6 开工、`crates/openbot-ui/src` 有真实组件、`tools/pins.toml` 的四个构建期二进制
#       可用之后，连同 `xtask` 的对应子命令一起同 PR 接入。
