# OpenBot CI —— 编排依据 = v3 §16.3〈Supply chain〉的固定清单 + v3 §19.3 的 parity 闸门。
#
# ===========================================================================
# 🛑 自动触发已关闭（2026-08-22）
# ===========================================================================
# 原因：本账号的 GitHub Actions 额度已耗尽。推 PR / 推分支**不会**有任何检查自己跑起来。
# 现状：只保留 `workflow_dispatch`。要跑就手动派发：
#
#     gh workflow run ci.yml --repo acosmi/OpenBot --ref <分支>
#
# 恢复方式：把下面 `# --- 自动触发（关闭中，原样保留）---` 到 `# --- 自动触发结束 ---`
# 之间每行开头的 `#   ` 去掉即可。**不要重新推导** paths / branches 清单 —— 注释里的这份
# 就是真源，它记录的是关闭前真实生效过的配置。
#
# ⚠️ 后果（必须知道）：自动触发关闭期间，**本机闸门是唯一的闸门**。CLAUDE.md §10 的实跑
# 清单从"合并前的双保险"变成"唯一保险"，一条都不能省。本机等价命令 = `cargo xtask ci`。
#
# ⚠️ 另一个会让人白等的坑：CONFLICTING 的 PR 一条 CI 都不会跑（GitHub 算不出
# `refs/pull/N/merge`），而 `gh pr checks` 显示 "no checks reported" —— 与"还没开始"
# 不可区分。先把 base 并进分支让 mergeable 变绿，再派发。
# ===========================================================================

name: CI

on:
  workflow_dispatch:
    inputs:
      run_supply_chain:
        description: "是否跑 supply-chain job（cargo deny / audit，比 gates 慢）"
        type: boolean
        default: true

# --- 自动触发（关闭中，原样保留）---
#   pull_request:
#     branches: [main]
#     paths:
#       - "Cargo.toml"
#       - "Cargo.lock"
#       - "rust-toolchain.toml"
#       - "rustfmt.toml"
#       - "deny.toml"
#       - "crates/**"
#       - "parity/**"
#       - "fixtures/**"
#       - "tools/**"
#       - ".github/workflows/ci.yml"
#   push:
#     branches: [main]
#     paths:
#       - "Cargo.toml"
#       - "Cargo.lock"
#       - "rust-toolchain.toml"
#       - "rustfmt.toml"
#       - "deny.toml"
#       - "crates/**"
#       - "parity/**"
#       - "fixtures/**"
#       - "tools/**"
#       - ".github/workflows/ci.yml"
# --- 自动触发结束 ---

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # 编译器版本不在这里钉 —— 仓根 rust-toolchain.toml 是唯一真源（CLAUDE.md §3）。
  # 在 workflow 里再写一遍版本号 = 第二个真源 = 迟早漂移。

# 用到的三个 action 的 major 版本，2026-08-22 用
#   gh api repos/<owner>/<repo>/releases/latest --jq .tag_name
# 实查过，不是凭印象写的：
#   actions/checkout        v7.0.1
#   Swatinem/rust-cache     v2.9.2
#   taiki-e/install-action  v2.86.5
# 注：本 workflow 从未在 GitHub Actions 上真跑过（额度耗尽，见文件头），
# 只在本机用 `python3 -c "import yaml; yaml.safe_load(...)"` 验过 YAML 可解析。

jobs:
  # =========================================================================
  # gates —— v3 §16.3 固定清单的前三条 + v3 §19.3 的 parity 闸门。
  # 与本机 `cargo xtask ci` **同一份判据、同一个顺序**：本机绿 ≠ CI 绿的差异只能来自环境，
  # 不能来自"两边跑的命令不一样"。
  # =========================================================================
  gates:
    name: gates（fmt / clippy / test / parity）
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: 安装 rust-toolchain.toml 钉住的工具链
        # rustup 读仓根 rust-toolchain.toml（channel + rustfmt/clippy components）。
        # `rustup show` 会触发安装并把实际版本打进日志 —— 判红时第一件事就是看这一行，
        # 确认两边编译器是同一个。
        run: rustup show

      - name: 记录版本（判红时的第一手证据）
        run: |
          rustc --version
          cargo --version
          cargo fmt --version
          cargo clippy --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: gates

      # 顺序与 v3 §16.3 逐条对应。
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy --all-targets --all-features -D warnings
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo test --locked
        # --locked：Cargo.lock 必须已提交且与 Cargo.toml 一致（v3 §16.3）。
        # lock 不同步时这一步会直接失败，而不是静默改写 lock 后继续。
        run: cargo test --workspace --all-features --locked

      - name: xtask parity-check
        # v3 §19.3："CI 拒绝未归类项和没有证据的 `done`"。
        # parity/ 为空时它打印 "0 ledger" 并通过 —— Phase 0 早期这是正确行为，
        # 不是漏检：ledger 还没被生成出来，没有可判定的对象。
        run: cargo xtask parity-check

  # =========================================================================
  # supply-chain —— v3 §16.3 里能在本仓当前状态下真跑起来的那几条。
  # 拆成独立 job 是因为它要联网拉 advisory-db，失败原因与代码质量无关，
  # 混进 gates 会让"闸门为什么红"这个问题多一个来源。
  # =========================================================================
  supply-chain:
    name: supply-chain（cargo deny / cargo audit）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ inputs.run_supply_chain }}
    steps:
      - uses: actions/checkout@v7

      - name: 安装 rust-toolchain.toml 钉住的工具链
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          key: supply-chain

      - name: 安装 cargo-deny 与 cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit

      - name: cargo deny（licenses / bans / advisories / sources 四段）
        # 配置 = 仓根 deny.toml。2026-08-22 本机实跑四段全 ok。
        run: cargo deny check

      - name: cargo audit / RustSec
        # 与 cargo deny 的 advisories 段判据重叠但不等价（audit 直读 Cargo.lock，
        # deny 走依赖图）。v3 §16.3 把两者并列，这里照列，不合并。
        run: cargo audit --deny warnings

# ===========================================================================
# v3 §16.3 固定清单里**尚未接线**的条目（status: todo）
# ===========================================================================
# 下面这些刻意**没有**写成 job。理由：它们各自缺一份本仓此刻还不存在的基线，接进来就是一条
# 恒红的闸门 —— 而一条恒红的闸门等于没有闸门（它会训练所有人忽略红色）。
# 每条都写明阻塞原因与解除条件，G0 收口时逐条勾掉：
#
# 1. cargo vet
#    阻塞：本仓没有 `supply-chain/config.toml` + `audits.toml` 基线，`cargo vet` 会对**每一个**
#          依赖报 unaudited 而直接失败。
#    解除：跑一次 `cargo vet init` 生成基线，选定 imports（如 mozilla / google 的公开 audit 集），
#          随 G0 的 provenance 产物一起入库。
#
# 2. OSV scan（Electron shim / packaged assets）
#    阻塞：Electron shim 与打包资产在 G6/G8 才存在（v3 §16.2），此刻没有扫描对象。
#    解除：`components/` 下出现 shim 源码与 lockfile 之后接 `osv-scanner`。
#
# 3. secret scan
#    阻塞：需要先选定工具（gitleaks / trufflehog）与 allowlist 基线，否则会被 fixture 里的
#          假 token 刷屏。注：.gitignore 已挡住 .env / *.pem 这一层，但那是预防不是扫描。
#    解除：G0 产出 `fixtures/**` 之后，连同 fixture 里"哪些看起来像密钥的字符串是假的"
#          一起定 allowlist。
#
# 4. license / NOTICE / provenance verification
#    阻塞：需要 `provenance/sources.spdx.json`（v3 §19.3 的 Phase 0 产物，本轮尚未生成）。
#    解除：该文件入库后，接一个比对"复用文件的 source repo / commit / original path / license /
#          copyright / modified flag / hash"是否与实际一致的校验步。
#
# 5. CycloneDX / SPDX SBOM
#    阻塞：无 —— 技术上现在就能跑（cargo-cyclonedx）。不接的理由是产物无人消费：
#          SBOM 要与第 4 条的 provenance 校验和第 7 条的签名一起才构成完整证据链。
#    解除：与第 4 条同 PR 接入。
#
# 6. reproducibility check（可复现构建）
#    阻塞：需要两次独立构建的字节比对基线，且发行物形态（v3 §16.1/§16.2）尚未定型。
#    解除：G8 定下发行物清单后接入。
#
# 7. artifact signature / provenance verification
#    阻塞：签名密钥与 release environment 尚未建立。
#    解除：G8 建立 release 边界后接入。
#
# ===========================================================================
# GUI 闸门（CLAUDE.md §10 "GUI 另加" / 设计系统文档 §15）—— G6 起接线
# ===========================================================================
# `cargo test -p openbot-ui` · `xtask i18n-check` · `xtask design-lint` · `xtask css-check` ·
# `xtask bundle-budget` · golden 截图（Web 110 张 / Desktop 每平台 54 张，差异像素 ≤ 0.1%
# 且无 8×8 全差异块）· CDP AX 树检查。
#
# 阻塞：`crates/openbot-ui` 在 Phase 0 连 leptos 依赖都刻意没引（不编 WASM），
#       上面每一条的判据对象都不存在。
# 解除：G6 开工、`crates/openbot-ui/src` 有真实组件、`tools/pins.toml` 的四个构建期二进制
#       可用之后，连同 `xtask` 的对应子命令一起同 PR 接入。
