    target: "openbot-infra::auth::config::KeyEncryptionKey"
    owner: "openbot-infra"
    test_id: "T-ENV-0042"
    migration_rule: "preserve"
    status: "done"
    done_evidence: "`KeyEncryptionKey` 解析 `KEY_ENCRYPTION_KEY`：base64 canonical 往返 + 长度 ∈ {16, 24, 32}（§28.1 R33 推翻了 §15.4 原写的「32 字节」——上游 WebCrypto 实测接受三档，硬要求 32 会让 16/24 字节 KEK 的部署永远迁不出自己的密文），16/24 允许启动但带稳定 code 告警；示例值在生产拒绝。本轮由 `openbot-server::config` / `openbot-infra::auth::config` 落地；解析器一律接受 `&BTreeMap<String, String>` 而**不读进程环境**（源码级闸门 `parsers_never_touch_the_process_environment`，配正向对照断言 `env.rs` 确实含 `std::env`）。实跑：`cargo test -p openbot-server config` = 47 passed、`cargo test -p openbot-infra auth::config` = 35 passed、`cargo clippy -p openbot-server -p openbot-infra --all-targets -- -D warnings` = exit 0。"
    evidence: "git grep -n \"KEY_ENCRYPTION_KEY\" -- server/src docs/configuration.md"
    notes: "KEY_ENCRYPTION_KEY —— §15.4 preserve 行。base64 解出长度必须 ∈ {16, 24, 32}，且必须是 canonical base64（decode 再 encode 要逐字符相等）。**Phase 0 这条原写「32 字节」是错的**：上游走 WebCrypto AES-GCM，实测接受 16/24/32（20/31 报 DataError），硬要求 32 会让 16/24 字节 KEK 的部署起不来因而永远迁不出自己的密文（§28.1 R33）；16/24 允许启动但告警建议轮换到 32。落点从 Phase 0 计划的 openbot-infra::vault 改到 openbot-infra::auth::config —— 它同时服务 v1 解密与 HMAC 标签派生，而 vault 的领域类型在 openbot-domain::vault，infra 侧没有 vault 模块承载配置。示例值 config.ts::PLACEHOLDER_KEY 在生产拒绝——上游判据是 NODE_ENV=production，Rust 版改由 OPENBOT_ENV 判（见 NODE_ENV 条）。v1 envelope 解密（§6.4）与 HMAC 标签派生都依赖它。"
