    migration_rule: "rename: OPENBOT_DEV_NO_AUTH -> OPENBOT_SINGLE_USER"
    status: "done"
    done_evidence: "`RENAMED_ENV_VARS` 收录 `OPENBOT_DEV_NO_AUTH`，命中旧名即拒绝启动并**点名新变量**；旧名与新名同时出现另有独立 code `renamed_env_var_collision`（偏向任一侧都会静默使用一个操作员没打算用的值）。本轮由 `openbot-server::config` / `openbot-infra::auth::config` 落地；解析器一律接受 `&BTreeMap<String, String>` 而**不读进程环境**（源码级闸门 `parsers_never_touch_the_process_environment`，配正向对照断言 `env.rs` 确实含 `std::env`）。实跑：`cargo test -p openbot-server config` = 47 passed、`cargo test -p openbot-infra auth::config` = 35 passed、`cargo clippy -p openbot-server -p openbot-infra --all-targets -- -D warnings` = exit 0。"
    evidence: "git grep -n \"OPENBOT_DEV_NO_AUTH\" -- server/src server/tests CHANGELOG.md  # 命中 dev-actor.ts::singleUserEnabled、single-user.test.ts、CHANGELOG 各一处；正向对照：同命令对 OPENBOT_SINGLE_USER 命中 20 处"
    notes: "OPENBOT_DEV_NO_AUTH —— **Phase 0 漏登记的第 71 个变量**，v3 §15.4 的处置表里原本也没有它（2026-08-22 G2 实施轮由子代理发现、主控复核补入，见 §28.1 R34）。它不是死变量：上游 server/src/auth/dev-actor.ts::singleUserEnabled 现在就在读它（trim() 后恒等 'true'），是 OPENBOT_SINGLE_USER 的历史别名，server/tests/single-user.test.ts 有对应用例。读取点不在 config.ts，所以本文件 recount 里那条只扫 config.ts 的 32 照不到它。裁决为 rename 而不是 remove：'不认它' 会让一个靠它跑单用户模式的部署以「没有 IdP 也没有单用户旗标」这个看起来无关的理由启动失败，操作员不会想到是变量改了名；给它一条自己的稳定 code 才能把人指到 OPENBOT_SINGLE_USER。test_id 号是补登记时追加的，因此不与本文件按字母序编号的号段连续。"
