    test_id: 'T-EVT-0001'
    migration_rule: 'preserve: AG-UI 0.0.57 线格式与事件名不改'
    status: 'todo'
    evidence: 'rg -n --no-heading -g ''!bun.lock'' ''RUN_STARTED|RUN_FINISHED'' . => agent-bot/src/index.ts::runAgent、examples/*/src/index.ts、server/tests/agent-connection-live.test.ts 均命中'
    notes: 'RUN_STARTED / RUN_FINISHED。v3 §7.5〈每个 run 恰好一个 terminal event〉+ §4.3 不变量 2〈(run_id, seq) 唯一、所有 terminal event 恰好一次〉。上游只在 SSE 流里顺序发送，没有任何唯一性约束；Rust 侧的唯一性由 run_events 的 (run_id, seq) 唯一索引承担。'
