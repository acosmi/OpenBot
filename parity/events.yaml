# OpenBot parity ledger —— events（AG-UI 事件族 / audit event 类型 / 新增语义事件）
#
# 真源：v3 §7.5（AG-UI 必须支持的事件族）、§4.3（run_events 与 (run_id,seq) 不变量）、
#       §8.6（audit 表语义）、§16.4（统一关联字段）、§8.1（唯一执行管线）、§2.4（不得照译的上游缺陷）。
# 上游只读克隆 = CopilotKit/openbot @ 891df72f1827454d8b353d108fe5dd2313b7e30d。
#
# 本文件的三类 entry 与标注约定：
#   (a) AG-UI 事件族 11 条，label=parity，owner=openbot-agent，target 落 §7.5 的边界模块 agui。
#       其中 6 族（state/messages snapshot/activity/step/reasoning/raw+custom/interrupt+resume）
#       在上游源码里 grep 零命中 —— parity 对象是 package.json 钉死的 @ag-ui/core 0.0.57
#       固定 schema，不是上游的调用点。每条的 notes 都带零命中数字与正向对照。
#   (b) audit event 类型 57 条，取自 server/src/audit.ts::auditEventTypes 的封闭集，一个名字一条。
#       其中 5 条（agent.invoked / connector.sync_failed / connector.sync_succeeded /
#       identity_provider.registered / knowledge.searched）在 server/src 无任何发出点。
#       owner 判据（机械）：发出点是进程启动顶层代码或传输层看门狗（无 use case）=> openbot-infra，
#       其余 => openbot-application（铸造）；落库一律 openbot-infra，见 §8.6 的 DB role 分离。
#   (c) 新增语义事件 20 条，label=新增，upstream=-。
#
# target 统一写事件名的 Rust 符号落点；audit 的名字是契约层封闭枚举（§5.1 openbot-contracts
# 的职责原文 = "native/wasm-safe ID、DTO、event、error、schema"），owner 写的是谁负责铸造它。

schema: events
schema_version: 1
upstream_commit: 891df72f1827454d8b353d108fe5dd2313b7e30d
generated_by: manual
recount:
  # 上游 audit event 类型封闭集的基数（本文件 label=parity 且 id 以 audit- 开头的 entry 数必须等于它）
  - command: |-
      sed -n '/^export const auditEventTypes/,/^] as const;/p' server/src/audit.ts | grep -oE '"[a-z_]+\.[a-z_]+"' | sort -u | wc -l
    cwd: upstream
    expect: 57
  # 声明了但 server/src 里零发出点的 audit event 名个数
  - command: |-
      comm -23 <(sed -n '/^export const auditEventTypes/,/^] as const;/p' server/src/audit.ts | grep -oE '"[a-z_]+\.[a-z_]+"' | tr -d '"' | sort -u) <(rg -o --no-heading --no-filename -g '!*.test.ts' -g '!audit.ts' '"[a-z_]+\.[a-z_]+"' server/src | tr -d '"' | sort -u) | wc -l
    cwd: upstream
    expect: 5
  # AG-UI 零使用族的负向判定 + 正向对照（同一条命令在 RUN_STARTED 上必须非零）
  - command: |-
      printf 'STATE_SNAPSHOT=%s RUN_STARTED=%s\n' "$(rg -c --no-heading -g '!bun.lock' STATE_SNAPSHOT . | awk -F: '{s+=$NF} END{print s+0}')" "$(rg -c --no-heading -g '!bun.lock' RUN_STARTED . | awk -F: '{s+=$NF} END{print s+0}')"
    cwd: upstream
    expect: 'STATE_SNAPSHOT=0 RUN_STARTED=17'
  # 本 ledger 的 entry 总数
  - command: |-
      grep -c '^  - id: ' parity/events.yaml
    cwd: repo
    expect: 88
  # 本 ledger 的 label 分布（11 AG-UI + 57 audit = 68 parity，20 新增）
  - command: |-
      printf 'parity=%s 新增=%s 替代=%s\n' "$(grep -c "^    label: 'parity'$" parity/events.yaml)" "$(grep -c "^    label: '新增'$" parity/events.yaml)" "$(grep -c "^    label: '替代'$" parity/events.yaml)"
    cwd: repo
    expect: 'parity=68 新增=20 替代=0'
  # owner 分布（openbot-agent 11；openbot-infra 3；其余 openbot-application 74 = audit 54 + 新增 20）
  - command: |-
      grep -oE "^    owner: 'openbot-[a-z]+'" parity/events.yaml | tr -d "'" | sort | uniq -c | awk '{print $3"="$1}' | paste -sd' ' -
    cwd: repo
    expect: 'openbot-agent=11 openbot-application=74 openbot-infra=3'
  # 新增 absolute deadline audit 在固定上游零命中；同形命令对既有 stall audit 命中 5 个文件。
  - command: |-
      printf 'deadline=%s stalled=%s\n' "$(git grep -l 'agent.run_deadline_exceeded' | wc -l | tr -d ' ')" "$(git grep -l 'agent.stream_stalled' | wc -l | tr -d ' ')"
    cwd: upstream
    expect: 'deadline=0 stalled=5'
  # Explicit memory audit 三事件在固定上游零命中；同形命令对既有 computer outcome audit 命中 5 个文件。
  - command: |-
      printf 'remember=%s computer=%s\n' "$(git grep -l 'memory.remember_' | wc -l | tr -d ' ')" "$(git grep -l 'computer.action_allowed' | wc -l | tr -d ' ')"
    cwd: upstream
    expect: 'remember=0 computer=5'
  - command: |-
      printf 'approval=%s decision=%s\n' "$(git grep -l 'tool.approval_' | wc -l | tr -d ' ')" "$(git grep -l 'mcp.call_succeeded' | wc -l | tr -d ' ')"
    cwd: upstream
    expect: 'approval=0 decision=8'
  - command: |-
      printf 'human=%s component=%s\n' "$(git grep -l 'component.human_' | wc -l | tr -d ' ')" "$(git grep -l 'component.function_called' | wc -l | tr -d ' ')"
    cwd: upstream
    expect: 'human=0 component=4'

