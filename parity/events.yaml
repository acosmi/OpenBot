    done_evidence: '领域测试 a_durably_recorded_unknown_commit_still_enters_reconciliation；application 单测/PG17 unknown_commit_is_durably_reconciliation_required_and_never_success 均证明已落库 unknown 仍 halt、返回 accepted reconciliation，绝不成为 ToolResult'
