    owner: 'openbot-application'
    test_id: 'T-EVT-0069'
    migration_rule: 'n/a: 上游无对应物'
    status: 'done'
    evidence: 'sed -n ''/^### 8.1 唯一执行管线/,/^### 8.2/p'' docs/2026-08-21-OpenBot全量Rust重写终版研究与实施方案.md => 管线第 6 步 "DB transaction: decision + attempt"'
    done_evidence: 'application 单测 decision_or_capability_write_failure_proves_executor_was_never_called；PG17 full_pipeline_commits_decision_attempt_capability_outcome_and_audit_in_order；duplicate_decision_cannot_reach_a_second_execution；ToolCallRepo commit 后才签 receipt'
    notes: '§8.1：decision 与 attempt 在同一个 DB 事务里、在 execute **之前**写。decision 写入失败即不执行。落表 tool_calls（§4.3）。上游无对应物：上游只有 mcp.call_rejected 这类事后审计行，没有"决定"这一独立记录。P0 指标 audit_before_action_violation > 0（§16.4）盯的就是这条被绕过。'
  - id: 'pipeline-attempt'
    upstream: '-'
    label: '新增'
    target: 'openbot-application::tool::invoke_tool + openbot-infra::repo::tools::PostgresToolJournal::record_decision'
    owner: 'openbot-application'
    test_id: 'T-EVT-0070'
    migration_rule: 'n/a: 上游无对应物'
    status: 'done'
    evidence: 'sed -n ''/^### 8.1 唯一执行管线/,/^### 8.2/p'' docs/2026-08-21-OpenBot全量Rust重写终版研究与实施方案.md => 同一步的 attempt 半边；§4.3 表清单含 tool_attempts'
    done_evidence: 'PG17 full_pipeline 逐行断言 attempt #0 从 decision_recorded 经 capability CAS 到 completed；decision/capability 任一前置写失败时 executor 调用数为 0；重复 decision 后 attempt 总数仍为 1'
    notes: '§8.1：attempt 与 decision 同事务写，记录"这次真的要去做了"。落表 tool_attempts（§4.3）。重试产生新的 attempt 行而不是覆盖旧行——§7.4 的 retry 分类（429/可重试 5xx/连接前失败 可退避；认证、schema、policy 错误不重试）由 attempt 序列承载。'
  - id: 'pipeline-outcome'
    upstream: '-'
    label: '新增'
    target: 'openbot-application::tool::invoke_tool + openbot-infra::repo::tools::PostgresToolJournal::record_outcome'
    owner: 'openbot-application'
    test_id: 'T-EVT-0071'
    migration_rule: 'n/a: 上游无对应物'
    status: 'done'
    evidence: 'sed -n ''/^### 8.1 唯一执行管线/,/^### 8.2/p'' docs/2026-08-21-OpenBot全量Rust重写终版研究与实施方案.md => 管线第 9 步 "outcome + commit_state"'
    done_evidence: 'PostgresToolJournal 在同一事务 UPDATE attempt + append allowlisted audit；PG17 audit_failure_rolls_back_outcome_and_forces_unaccepted_reconciliation 实测 audit 故障后 attempt 仍 executing/commit_state NULL 且 executor 恰 1 次'
    notes: '§8.1：execute 之后写。执行发生但 outcome 无法写入时，run 进入 ReconciliationRequired，不能继续工具循环也不能自动重试。这一条与 §2.4 的 MCP 审计前移是同一枚硬币的两面：上游把 succeeded/failed 写在 vendor 之后**且没有前置 decision**，所以一条死在 vendor 的调用会留下 call_succeeded。'
