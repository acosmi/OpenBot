# parity/routes.yaml —— 上游 31 个 route 文件（26 页 + 5 layout）逐个映射，外加 v3 §3.1 条 7
# 明写的 1 个 31 之外的新增页（native memory 控制面）。合计 32 条 entry：parity 31 + 新增 1。
#
# 真源：v3 §3.1（GUI 与用户旅程十条、31 = 26 + 5 的口径）、v3 §3.2（无权访问统一 404）、
# v3 §21.1 条 2（每个页面至少一个核心 journey 和权限可见性测试）、
# 设计系统文档 §5.2（四类页面模板 Chat / List / Form / Focus）、§13（`openbot-ui` 内部结构：
# `shell/` 放 App shell、路由表与 5 个 layout；页面视图组件来自 `features::<组>`）。
#
# 字段约定：
# - target 写成 `<Rust 落点> -> <Leptos route 路径>`，两者都是本条的落点契约。
#   Leptos 路径用 leptos_router 的 `:param` 写法；TanStack 的 pathless 段（`_authed` / `_app`）
#   不进 URL，所以 layout 条目的路径写 `(pathless)`。
# - notes 依次记：页面模板（设计系统文档 §5.2）、核心 journey（v3 §21.1 条 2）、权限可见性。
# - status 全为 todo：本仓当前零实现代码（`find crates -name '*.rs'` 只有 10 个 `lib.rs`
#   加 1 个 `bin/xtask.rs`），任何 done 都会是假 done。

