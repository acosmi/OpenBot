    notes: "登记在本表是因为它是每一条输入操作的前置栅栏：v3 §12.5 要求 lease transfer / release / expiry / navigation / computer restart 都递增 epoch，且「旧 input 即使已经躺在 socket buffer 里也会被拒绝」。上游没有这层——它只有一个布尔式的「谁握着方向盘」，所以一条在 take 之前就发出、在 take 之后才被处理的输入会被当成合法输入执行。**这是新增，不得写进任何 parity 条目的 migration_rule 里冒充当前行为**：T-BROP-0006 / 0009 / 0021 / 0003 四条的 notes 都只承诺上游可观察行为，epoch 部分统一指回本条。2026-08-28 v3 R124：target 按 Batch51 实际落点改为 openbot_computer::control::ControlService（原写的 screen::lease 模块不存在）；同批发现 HumanLeaseEpoch::next 用 saturating_add——到 u64::MAX 后 epoch 不再推进、栅栏失效，现有断言 `HumanLeaseEpoch::new(u64::MAX).next().get() == u64::MAX` 恰好把这个行为固定了下来。v4 overlay 记 revalidate + defect：P0-code 改为 checked 递增，溢出进入 poisoned 状态（清 lease、拒绝输入与 acting，直到 ComputerGeneration 推进），修复后本条在新符号上重跑；历史 status 不回写。"

