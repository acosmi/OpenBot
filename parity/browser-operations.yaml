  - id: decision-no-ime-and-drag-variants
    upstream: "-"
    label: 新增
    target: "openbot_computer::browser::protocol::BrowserInput（封闭 enum：无 ImeComposition / Drag 变体）"
    owner: openbot-computer
    test_id: T-BROP-0045
    migration_rule: "n/a: 协议裁决，不是可迁移的上游行为"
    status: done
    done_evidence: "Batch51 BrowserInput是exhaustive八变体MouseMove/MouseDown/MouseUp/Wheel/KeyDown/KeyUp/InsertText/SecretInsert；kind() exhaustive match与exact-vector单测锁集合，类型中无ImeComposition/Drag。move clickCount=0、down/up非零由私有字段+构造器保证。真实CDP映射仍由0037–0044保持todo。"
    evidence: "grep -oE 'type: \"(mouse|wheel|key|text)\"' agent-computer/src/screencast.ts | sort -u 得 4（mouse / wheel / key / text），上游 union 本来就没有 IME 与 drag 变体；performHumanInput 的 /human/type 分支用 keyboard.insertText 而不是逐键 type"
    notes: "v3 §12.5 裁决原文：不设 IME composition 与 drag 两个独立变体。理由逐条可验：① IME 合成发生在 viewer 自己的输入元素里，合成完成的文本走 insertText——上游 /human/type 正是这样做的（T-BROP-0019），engine 从不需要看见合成中间态；② 拖拽就是 down -> move -> up 序列（T-BROP-0038 / 0037 / 0039），engine 不需要知道「这是一次拖拽」。标 新增 是因为它是本方案立的协议约束，不是从上游继承来的行为——上游没有这两个变体是「没做」，这里是「明确不做并说明为什么」，两者不能混为一谈。代价必须写明：真出现「必须知道是拖拽」的场景（HTML5 dragstart/dragover/drop 事件序列在某些站点上无法由裸鼠标事件合成）时，这是一次需要重新立项的协议扩展，不是实现期可以顺手加的变体。v3 §12.6 已把「IME 合成文本经 insertText」与「down->move->up 拖拽序列」两条列进必须覆盖的测试面。"
