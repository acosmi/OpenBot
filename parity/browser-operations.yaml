# parity/browser-operations.yaml —— computer 面（浏览器 + File/shell）的封闭操作台账。
#
# 真源：v3 §11.2（Engine 协议、`BrowserOperation` 封闭 enum 的 R1 成员、R1 无 download/upload、
# File/shell 是 computer 的另一组封闭操作）、v3 §11.3（Browser 安全配置，含 download/upload
# 未来规则已写死）、v3 §12.5（输入 union、HumanLease、不设 IME composition 与 drag 两个独立变体）、
# v3 §18〈Browser actions〉与〈File/shell〉两行、v3 §28.4（计数复算命令）。
#
# 口径说明（复核时先读这三条，否则条数会对不上）：
#
# 1. 本表的骨架是 v3 §28.4 那条命令取出的 29 条手写路径，一条一 entry（T-BROP-0001..0029），
#    顺序 = 该命令 `sort -u` 的输出顺序，方便逐行对拍。29 条里有 2 条不是 HTTP route：
#    `/profiles` 与 `/workspace` 是 `PROFILES_DIR` / `WORKSPACE_DIR` 的默认目录字面量
#    （`agent-computer/src/index.ts::profiles` / `::workspace` / `::shell` 三处 `?? "/..."`），
#    §28.4 的正则抓的是"引号包住的路径形字面量"而不是"路由"。这一点必须写明，
#    否则下一轮会有人把 29 当成"29 个 endpoint"。
# 2. v3 §18〈File/shell〉那行的四条封闭操作（files/list、files/read、files/write、exec）
#    本来就在这 29 条里，所以不另开重复 entry，而是就地标注它们属于 File/shell 封闭集、
#    **不进** `BrowserOperation`（v3 §11.2 末句）。四条上游都在，label 全 parity。
# 3. 29 条之外另有 21 条 entry（T-BROP-0030..0050）：3 条 screencast 子操作 + 1 条 profile ensure
#    + 3 条 R1 新增/负向闭合（download_refused / JS dialog dismiss / 无 upload）
#    + 8 条 §12.5 输入 union 成员 + 1 条 IME/drag 裁决 + 1 条 lease epoch 栅栏
#    + 4 条 P0-code Engine 契约（boot / role / confinement / Browser role conformance）。
#
# 关键负向断言（v3 §11.2「没有 download、没有 upload」）：
#   `grep -rlE 'page\.on\(|setInputFiles|filechooser' agent-computer/src | wc -l` = 0。
#   本轮为它配了两条正向对照，分别排除"正则写错"和"目录写错"两种假 0：
#   recount 第 3 条 = 同一条正则换到确实含这三个字面量的目录（repo 的 docs/）得 1；
#   recount 第 4 条 = 同一个目录、同一种 grep 调用换成确实存在的字面量得 1。
#   同族还有两组：download 的负向（第 5 条得 1，唯一命中是 workspace.ts 注释里的 `downloaded`）
#   配第 6 条（server/src 得 2）；dialog 的负向（第 7 条得 0）配第 8 条（app/src 得 10）。
#   recount 里所有 command 都是可直接执行的裸命令，不带任何说明前缀，方便 CI 逐条重跑。
#
# Batch52 后本表 7 done / 43 todo：只关闭不依赖 Electron/CDP 的 control/HumanLease 状态机与
# closed input-union 裁决。mouse/wheel/key/secret 的真实 CDP execution、engine reject、screen/frame/
# viewer ticket 仍全部 todo，不能用 Rust enum 冒充运行时。
#
# owner 全表固定 openbot-computer（v3 §5.1 十 crate 之一；§18 里 Browser actions / Supervisor /
# File/shell 三行的 Rust owner 都是 computer）。Screen/input 行在 §18 写作
# `computer/server/desktop`，本表只登记 computer 侧的操作契约，viewer ticket / WS 传输那半
# 不在本 ledger。

