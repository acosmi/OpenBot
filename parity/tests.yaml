#     （唯一那处在 agent-computer/tests/control.test.ts；`\btest\(` 的词边界会把 `.test(` 一并命中）
#   AST  1047 = 同一批 `test(` 1006 + 41 处柯里化 `test.each([...])("标题", fn)`
#     （`\b(test|it)\(` 匹配不到 `test.each(`，柯里化用例的标题实参在外层调用上）
