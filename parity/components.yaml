    label: "parity"
    target: "openbot_ui::features::gallery::sandboxed::wrapper"
    owner: "openbot-ui"
    test_id: "T-CMP-0009"
    migration_rule: "preserve: 注入语句与作者脚本之间的先后次序不变"
