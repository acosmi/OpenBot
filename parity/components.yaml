entries:
  # =========================================================================
  # (a) compiled gallery —— 8 个上游文件，逐个重写为 Leptos。
  #
  # 五项必须保留的能力（v3 §3.3 条 1）在每条 notes 里逐项落到符号：
  #   ① 参数 schema        ② published 状态       ③ per-Bot withholding
  #   ④ data-function grant ⑤ tool-call-time 再授权
  # =========================================================================

  - id: "gallery-activity"
    upstream: "app/src/components/gallery/activity.tsx::GALLERY"
    label: "替代"
    target: "openbot_ui::features::gallery::activity"
    owner: "openbot-ui"
    test_id: "T-CMP-0001"
    migration_rule: "preserve: 工具名 showActivityReport 与参数 schema 不变，React 实现换成 Leptos"
    status: "done"
    done_evidence: "Batch44闭合showActivityReport exact schema、build-owned botActivity/recentRefusals、admin ACL/hot policy/function grant/call audit与两种typed report，并保留Settings不可预览；Batch45把fresh provider definition、args-derived function、call-time decision、durable call/result/Agent三向配对与safe conversation mount接入。Batch46把上游两条conversation follow-up ask逐字接入唯一native BeginThreadRun：按钮只在真实非空data与conversation callback存在时显示，busy/resumable/submitting明确disabled；PendingTurn绑定Server-derived Agent，失败Retry重放exact thread/run/Agent/message。UI conversation12/0/0、Activity1/0/0、Clippy/WASM/五bundle闸门绿。release浏览器Activity/Refusals两report与两按钮各1；busiest首次注入503后Retry可用、actions/textarea锁定，第二次以完全相同runId/botId/anchor/message得201；Refusals另一次201，两prompt逐字exact，durable user/assistant均agentId bot-0；hard reload后prompt/button/report各1，1440/600 overflow0、duplicate/nested application error0。"
    evidence: "grep -h '^    name: \"' app/src/components/gallery/*.tsx | wc -l = 13；本文件贡献 showActivityReport 一条"
    notes: "唯一会自己读部署数据的 gallery 组件。① 参数 schema = activity.tsx::ActivityReportProps；② published 状态 = server/src/db/schema/components.ts::components 的 publishedDescription（null 即模型永不被提供该组件）；③ per-Bot withholding = 同文件 componentExclusions（开放默认，有行才是例外）；④ data-function grant = 同文件 componentFunctions（缺行即拒，activity.tsx::GALLERY 的 reads 回调声明本次调用要读哪个函数）；⑤ tool-call-time 再授权 = app/src/lib/copilot/gallery-tools.tsx::GrantedTool 的 handler 调 decideComponent，服务端 server/src/components/routes.ts 的 POST /:name/decision 与 POST /:name/call 各自复核 canUseBot + store.decide + store.mayCall 并写 audit。本条实测 grep -c callComponentFunction 命中 3 次，是判定沙箱侧为零的正向对照。上游刻意不给它 preview（Admin 画廊里显示为不可预览），Leptos 版必须保留这个缺省，否则 Admin 页会用当前活跃 Bot 的身份发起一次真实读取。"

  - id: "gallery-cards"
    upstream: "app/src/components/gallery/cards.tsx::GALLERY"
    label: "替代"
    target: "openbot_ui::features::gallery::cards"
    owner: "openbot-ui"
    test_id: "T-CMP-0002"
    migration_rule: "preserve: showRecord / showMetrics / showChecklist / showNotice 四个工具名与参数 schema 不变"
    status: "done"
    done_evidence: "Batch45 把 showRecord/showMetrics/showChecklist/showNotice 四个独立名字、closed 参数 schema、上游逐字确认语句注册进共享 Rust registry；PostgreSQL provider-context 实测只向模型发当前 published 且未按 Agent withheld 的定义，下一次上下文立即反映撤权。每次调用重新校验参数并走 fresh component decision，拒绝形成单个 durable error tool reply；会话投影把 assistant tool-call + tool result 合成一个安全 Leptos renderer，拒绝时只画共享 RefusedCard。contracts5/0/0、gateway5/0/0、UI conversation11/0/0、runtime1/0/0、PG provider1/0/0；release 真浏览器成功 Quote/拒绝 Notice 证明同一生产投影、拒绝正文不泄露、hard reload/1440/1024/600 overflow0。"
    evidence: "grep -h '^    name: \"' app/src/components/gallery/*.tsx | wc -l = 13；本文件贡献 showRecord / showMetrics / showChecklist / showNotice 四条"
    notes: "一个文件四个注册项，Leptos 版必须仍是四个独立工具名而不是一个带 kind 参数的合并组件（工具名是目录键、Admin 行键与 grant 键，合并会静默改掉三处身份）。① 参数 schema = RecordCardProps / MetricsCardProps / ChecklistCardProps / NoticeCardProps；②③④⑤ 与 gallery-activity 同一套：components.publishedDescription / componentExclusions / componentFunctions / gallery-tools.tsx::GrantedTool 的 handler + routes.ts 的 /decision 与 /call。本文件无 reads 回调，即不读部署数据，只画模型给的参数。"

  - id: "gallery-charts"
    upstream: "app/src/components/gallery/charts.tsx::GALLERY"
    label: "替代"
    target: "openbot_ui::features::gallery::charts"
    owner: "openbot-ui"
    test_id: "T-CMP-0003"
    migration_rule: "preserve: showBarChart / showPieChart / showLineChart / showAreaChart / showProgress 五个工具名与参数 schema 不变"
    status: "done"
    done_evidence: "Batch45 把 showBarChart/showPieChart/showLineChart/showAreaChart/showProgress 五个独立工具定义接入与 renderer 同源的共享 registry；Line/Area 复用同一 points schema，所有 schema closed，未知/多余/越界参数在 fresh decision 前拒绝。真实 PostgreSQL provider-context 证明 definition 与 current published/per-Agent withholding exact 且撤权下一次 load 生效；gateway 每次调用复核 component decision，durable history 按 call id 合并后由 Leptos 安全画图或共享 RefusedCard。contracts5/0/0、gateway5/0/0、UI conversation11/0/0、runtime1/0/0、PG provider1/0/0；8-crate Clippy、WASM、release bundle 五闸门全绿。"
    evidence: "grep -h '^    name: \"' app/src/components/gallery/*.tsx | wc -l = 13；本文件贡献五条，是 8 个文件里注册项最多的一个"
    notes: "五个注册项，其中 AreaChartProps 直接等于 LineChartProps（charts.tsx::AreaChartProps），Leptos 版要保留这层复用而不是抄两份 schema，否则两个工具的参数会各自漂移。① 参数 schema = BarChartProps / PieChartProps / LineChartProps / AreaChartProps / ProgressChartProps；②③④⑤ 同 gallery-activity。上游图表是手写 SVG（charts.tsx::Plot / Legend / Empty），不依赖 JS 图表库，因此 Leptos 版不需要引入运行时库；这一点与设计系统文档 §6.3〈六个运行时 JavaScript 库的替代〉不冲突，本轮未逐库核对，见本文件末尾未验证项。"

  - id: "gallery-decisions"
    upstream: "app/src/components/gallery/decisions.tsx::GALLERY"
    label: "替代"
    target: "openbot_ui::features::gallery::decisions"
    owner: "openbot-ui"
    test_id: "T-CMP-0004"
    migration_rule: "preserve: askApproval / askChoice 两个工具名、参数 schema 与 HITL 挂起语义不变"
    status: "done"
    done_evidence: "Batch48把askApproval/askChoice以kind=decision同批加入13项manifest/provider/schema/Leptos registry；runtime原样传provider call id、Rust UUIDv7另作decision/internal identity，HumanRequired进入AwaitingHuman，answer后只回ExecutingTools，durable exchange checkpoint提交后才load context/resample。取消时human waiter以detached JoinHandle继续到PG观察terminal并写cancelled audit，ordinary effect仍drop-first/reconciliation；拒绝/坏参数也返回单个error tool result，不挂死run。PG17.11完整竖切实得pending前run=running/tool result=0、跨Application answer、answered row与requested/answered audit各1、provider第二次context含exact assistant/tool pair；catalogue/human/provider-context另各1/0/0。最终release浏览器实得Approval/Choice pending各1、提交后complete、hard reload仍complete、Choice Enter有效且stored Production选中、坏/重复DOM与console均0。"
    evidence: "grep -c respond app/src/lib/copilot/sandboxed-tools.tsx app/src/components/gallery/decisions.tsx app/src/lib/copilot/gallery-tools.tsx = sandboxed-tools.tsx:0 decisions.tsx:12 gallery-tools.tsx:7"
    notes: "kind=decision 是唯一走 useHumanInTheLoop 的分支（gallery-tools.tsx::GrantedDecision），它会挂起整个 run，所以⑤ tool-call-time 再授权在这里的形态不同：被拒时 gallery-tools.tsx::RefusedDecision 必须调 respond 把 tool call 答掉，否则 run 永远挂着。这条 HITL 半边的落点是 openbot-application（v3 §8.5 Approval），本 ledger 按主控指定的 owner 域记为 openbot-ui（渲染面）——两侧同 PR 落地，缺任一即挂死。① 参数 schema = ApprovalCardProps / ChoiceCardProps；② published / ③ withholding / ④ data-function grant 同 gallery-activity。decisions.tsx::readResult / readDecision / readChoice 是结果回读，Leptos 版必须一并搬，否则已完成的决策卡重渲染会丢掉用户答案。"

  - id: "gallery-frame"
    upstream: "app/src/components/gallery/frame.tsx::GalleryFrame"
    label: "替代"
    target: "openbot_ui::features::gallery::frame"
    owner: "openbot-ui"
    test_id: "T-CMP-0005"
    migration_rule: "preserve: 外框与 Badge 的语义色调词表不变"
    status: "done"
    done_evidence: "Batch40 `GalleryFrame`保留optional title/caption/action/children语义，figure+figcaption命名结构；`GalleryTone`恰neutral/positive/caution/negative四值并由单测逐项锁定。视觉按本项目第一真源改为中性无边框chrome，语义色只落GalleryBadge文字+状态点；design-lint/CSS check/reduced-motion全绿。release Quote index/detail真实复用同一Frame，preview aria-hidden、nested interactive0、overflow0。"
    evidence: "grep -l '^export const GALLERY' app/src/components/gallery/*.tsx 不含 frame.tsx（5 个文件命中，frame/preview/refused 不在其中）"
    notes: "支撑件，不是注册项：它没有 GALLERY 导出，因此不占工具名、没有参数 schema、不参与 published/withholding/grant/再授权这四项——五项能力在这条上只有第①项以 props 形式存在（frame.tsx::GalleryFrame 的 title/caption/action/children）。frame.tsx::Tone 是固定四值语义色调词表（neutral/positive/caution/negative），Leptos 版必须仍是封闭枚举，落到 design token 而不是硬编码 Tailwind 颜色类。"

  - id: "gallery-preview"
    upstream: "app/src/components/gallery/preview.tsx::GalleryPreview"
    label: "替代"
    target: "openbot_ui::features::gallery::preview"
    owner: "openbot-ui"
    test_id: "T-CMP-0006"
    migration_rule: "preserve: 不可预览组件显示为不可预览瓦片而非渲染失败"
    status: "done"
    done_evidence: "Batch44 renderer/manifest加入无preview的showActivityReport；ComponentPreview对该current renderer走专用localized不可预览句子，不实例化ActivityReportCard。release浏览器index/detail/hard reload均实得Activity tile1、figure/runtime DOM0、unavailable句子true；12 published tiles中stale仍走另一renderer_unavailable文案，unpublished future为0，overflow/duplicate/nested/console均0。"
    evidence: "grep -l '^export const GALLERY' app/src/components/gallery/*.tsx 不含 preview.tsx；preview.tsx::PreviewOf 与 firstSentence 是其内部符号"
    notes: "支撑件，不是注册项（无 GALLERY 导出，不占工具名）。它消费 gallery-registry.ts::GalleryComponent 的可选 preview 字段：省略 preview 的组件（当前只有 activity）必须画成不可预览瓦片，而不是当成渲染失败——这是①参数 schema 之外唯一与五项能力相关的行为，且是 Admin 页避免以活跃 Bot 身份发起真实读取的那道闸。Leptos 版的 preview 数据来源同样必须与组件定义同处一地，否则新增组件时可以忘记决定它怎么自我介绍。"

  - id: "gallery-quote"
    upstream: "app/src/components/gallery/quote.tsx::GALLERY"
    label: "替代"
    target: "openbot_ui::features::gallery::quote"
