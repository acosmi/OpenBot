# OpenBot parity ledger —— Generative UI 与 Components（v3 §3.3 / §21.1 条 5 / 设计系统文档 §6.2）。
#
# 两类 entry：
#   (a) compiled gallery —— 上游 `app/src/components/gallery/*.tsx` 每个文件一条（8 条）。
#   (b) sandboxed component —— `app/src/lib/copilot/sandboxed-tools.tsx` 与
#       `app/src/routes/_authed/admin/playground.tsx` 定义的运行时契约，逐条拆开（12 条）。
#   (c) Desktop 独立 renderer 的两条必然后果（v3 §3.3 末段写死，2 条）。
#   (d) P0-code Engine component role 的 render session / conformance 阶段门（2 条）。
#
# label 的判据（CLAUDE.md §4 硬要求，不得含糊）：
#   parity = 上游此刻真的这么跑，本轮有命令输出为证；
#   新增   = v3 写死的加固，上游第一方源零命中（每条都配了正向对照，证明 grep 的作用域确实
#            覆盖到了沙箱调用点，而不是"命令根本没扫到那里"）；
#   替代   = 同一能力换实现（React → Leptos）。
#
# 未验证项一律 status: todo 并在 notes 里写明缺什么；Batch40起只按完整证据逐条推进done。

