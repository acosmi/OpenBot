    evidence: "grep -h '^    name: \"' app/src/components/gallery/*.tsx | wc -l = 13；本文件贡献 showQuote 一条"
    notes: "① 参数 schema = quote.tsx::QuoteCardProps；②③④⑤ 同 gallery-activity（components.publishedDescription / componentExclusions / componentFunctions / gallery-tools.tsx::GrantedTool 的 handler + routes.ts 的 /decision 与 /call）。无 reads 回调，不读部署数据。"

  - id: "gallery-refused"
    upstream: "app/src/components/gallery/refused.tsx::RefusedCard"
    label: "替代"
    target: "openbot_ui::features::gallery::refused"
    owner: "openbot-ui"
    test_id: "T-CMP-0008"
    migration_rule: "preserve: data-testid=component-refused 与 role=status 不变"
    status: "done"
    done_evidence: "Batch50把既有RefusedCard直接复用于SandboxedComponentFrame启动/host拒绝、SandboxedConversationComponent缺source/坏result以及compiled runtime；没有第二份沙箱拒绝DOM。固定data-testid=component-refused与role=status保持。release IAB会话实得compiled refusal+sandbox capability不可用两张共享卡，testid恰2、author source正文0；Playground同一组件testid1。"
    evidence: "grep -l '^export const GALLERY' app/src/components/gallery/*.tsx 不含 refused.tsx；被 gallery-tools.tsx 与 sandboxed-tools.tsx 双方 import"
    notes: "支撑件，不是注册项（无 GALLERY 导出）。它是⑤ tool-call-time 再授权与②③④三项拒绝的唯一可见出口：compiled 侧（gallery-tools.tsx::GrantedTool / GrantedDecision）与 sandboxed 侧（sandboxed-tools.tsx::SandboxedTool）都渲染它，所以 Leptos 版必须是两条路径共用的同一个组件，不能各画各的。上游把 data-testid=component-refused 与 role=status 写死，是拒绝可被自动化断言的唯一抓手，迁移必须逐字保留。"

  # =========================================================================
  # (b) sandboxed component 运行时契约 —— 逐条拆开。
  #
  # 判定 parity 与 新增 的共同前提（本轮实测）：上游第一方源（app/ server/ shared/）里
  #   grep -rE 'allow-scripts|allow-same-origin|default-src|Content-Security-Policy|nonce' = 0 行，
  #   grep -rE 'MessageChannel|postMessage' = 0 行。
  # 正向对照：把同一条 grep 的 pattern 加上一个确定存在的词（OpenGenerativeUIActivityRenderer /
  #   useFrontendTool），命中数分别变成 4 与 22，且 4 行正好是两个沙箱渲染调用点本身
  #   （sandboxed-tools.tsx 两处、playground.tsx 两处）——证明 grep 的作用域确实覆盖到了
  #   沙箱调用点，"零命中"不是"命令没扫到那里"。
  # 因此隔离实现在依赖 @jetbrains/websandbox（经 @copilotkit/react-core@1.68.3 引入，
  #   bun.lock 里锁到 1.3.1）内部，而不是在上游第一方代码里。
  # =========================================================================

