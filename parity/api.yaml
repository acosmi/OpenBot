# OpenBot parity ledger —— HTTP API 面（Phase 0 / Evidence Freeze，v3 §19.3 与 §24 G0）
#
# 覆盖范围（v3 §1.3 口径，逐项由本文件 recount 段的命令复算）：
#   - server/src 的 95 条静态 Hono handler（含 4 处多行写法：app.delete(、app.post( x2、routes.get( ）
#   - 9 处 app.route() 模块挂载（不计入 95）
#   - 2 处 use() 中间件（app.ts 的 serveStatic、computer/routes.ts 的 /:botId/* 鉴权）
#   - 1 处 app.on(["GET","POST"], "/api/auth/*") 的 Better Auth 动态挂载
#   - CopilotKit /api/copilotkit 动态注入（§15.2 → Rust compatibility facade，标 替代）
#   - supervisor/src/index.ts 的 5 条 + 其 Bearer token 中间件
#   - agent-computer/src/index.ts 的 29 个词法命中 = 27 条真实可分派路径 + 2 个容器挂载目录默认值
#
# 标签口径（CLAUDE.md §4 硬要求）：parity = 上游已有；新增 = 上游没有；替代 = 换实现/换协议。
# v3 §2.4 列出的"不得照译"缺陷（#36 每跳重查、#53 凭据轮换单事务、#72 空 history 200、
# MCP 审计前置、grant 不静默复活）仍是 parity —— 端点存在于上游，只是语义被修正；
# 每一条都在 notes 里写明"缺陷修正，不照译"。
#
# owner 口径（v3 §5.2）：HTTP 端点是 transport，只做认证 / framing / 大小限制 / 错误映射，
# 因此 owner = 承载该端点的进程所属 crate（openbot-server 或 openbot-computer）；
# 业务规则本身归 openbot-application，由 target 指向的 handler 通过 ApplicationService 调用。
#
# 错误码集合（notes 内）依据 v3 §15.3，并与本轮从上游各 route 文件实测到的状态码对齐。

