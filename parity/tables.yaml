# parity/tables.yaml —— Phase 0 Evidence Freeze（v3 §19.3 产物、§24 G0 闸门）
#
# 记什么由 v3 §14.2 固定：每张现有表记录 Rust aggregate/repository、主键、unique、
# 外键、delete behavior、encryption、retention、API owner、migration。上述九项全部落在
# 每条 entry 的 notes 里（target 只放 Rust 表落点，repository 在 notes 的 `repo=` 段）。
#
# 三类 entry：
#   1. 上游 28 张表（表名取自 server/src/db/schema/*.ts 的 pgTable 实参，不抄文档）—— label: parity
#   2. 上游 13 条 migration（server/drizzle/0000–0012）—— label: parity
#   3. Rust-owned native 新表（当前 18 张，含 audit/tool/approval/UI/memory/decision/budget）—— label: 新增
#
# status 随实施推进；权威计数是 `cargo xtask parity-check --json`。done 只表示本条 target
# 与证据已落地，不蕴含 notes 里的 repository 已实现。
#
# 【2026-08-22 G1 实施轮更正】这 13 条 migration 的 target 原本写作
# `openbot-infra::db::migrations::m0000_schema` 等，那是 Phase 0 的一处错误：v3 §14.1 明写
# "升级前先要求旧 OpenBot 把数据库迁到当前第 13 条 migration（0012）；Rust 不接收更早 schema"，
# 也就是说 **Rust 永远不会重放这 13 条 migration**，`db::migrations` 这个模块不该存在。
# 它们的真实落点是两处：`openbot-infra::db::baseline`（fresh install 一次建成 0012 终态，
# 等价于这 13 条的累积效果）与 `openbot-infra::db::compat`（拒绝未到 0012 的库）。
# target 统一改为 `openbot-infra::db::baseline`，compat 侧的职责写在各自 notes 里。
#
# 另记一条本轮挖出的盲区（已写进 v3 §14.1 与 §28.1 R24）：13 条里 `0003_backfill_account_issuer`
# 是**唯一的纯数据迁移**（只有一句 UPDATE，不动结构），而终态 `accounts.issuer` 可空无默认值，
# 所以"跑到 0002 未跑 0003"与"完整迁到 0012"的 schema 事实逐字段相同 —— 纯 schema 的边界检查
# 在构造上照不到它。判据必须是**迁移账本**而不是数据形状：上游用 `drizzle-kit migrate`
# （server/package.json::db:migrate），drizzle.config.ts 未自定义账本位置，故账本在
# `drizzle.__drizzle_migrations`，本地对照物是 server/drizzle/meta/_journal.json 的 13 条 tag。
# 账本缺失时必须如实报"无法验证"，不得默认通过、也不得用数据形状去猜。
#
# 【自我更正】本轮第一版判据写的是"accounts 中 issuer IS NULL 的行数为 0"，**那是错的**：
# 下面 tbl-accounts 的 notes 里早就记着"滚动发布期旧 replica 仍会插入不带该列的行"，
# 也就是 NULL 在完整迁移过的库上合法，fail-closed 会拒绝健康的库。Phase 0 的台账已经
# 捕获了这条事实，是写 R24 时没先查自己仓里的记录。教训按原样留在这里。
#
# 【status: done 的含义】done = 该条 target 指向的 Rust 落点已实现且有本轮实跑证据。
# 它**不蕴含** notes 里 `repo=` 那个仓储类型已经存在 —— 那是 §14.2 要求 Phase 0 记录的
# "Rust aggregate/repository" 规划落点，属 G2 及以后的工作。G1 交付的是 db::tables 的
# 保真行结构 + baseline + compat 边界检查，不是仓储层。别把 done 读成"仓储已就绪"。
#
# 【2026-08-24 G3 native base】0016 十张物理表与剩余十个 repository 同批落地；
# `repo::IMPLEMENTED_REPOSITORIES` 现为 40，PG17 真库测试
# all_forty_current_repositories_touch_their_real_tables 逐个调用。下面四条 recount 双向保证
# planned 40 / implemented 40 / 缺失 0 / 越界 0；没有用空 struct 占名。
#
# 迁移边界（v3 §14.1 + §14.3）：Rust 只接收已迁到第 13 条 migration（0012）的库；
# 兼容期只允许新表 / nullable column / backfill / index / 非破坏性 constraint 验证，
# 禁止 drop、rename、类型收紧、主键改写。所以 0010 / 0011 已经删掉的表不重建，
# 也不再删一次；intelligence_channel_mappings 保留（见其 notes）。

