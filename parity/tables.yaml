    cwd: upstream
    expect: 2
  # memories / memory_events 是替代面而非 parity 面（v3 §28.1 R7）：上游零生产代码命中。
  - command: "grep -rn -i '\\bmemor' app/src server/src --include=*.ts --include=*.tsx | grep -v test | grep -vE ':[0-9]+:[[:space:]]*(\\*|//|/\\*)' | wc -l"
    cwd: upstream
    expect: 0
  # 上一条的正向对照：同一条「剔除注释行」管线在 channel 上命中 437 行。
  - command: "grep -rn -i '\\bchannel' app/src server/src --include=*.ts --include=*.tsx | grep -v test | grep -vE ':[0-9]+:[[:space:]]*(\\*|//|/\\*)' | wc -l"
    cwd: upstream
    expect: 437
  - command: "grep -oE 'repo=([A-Za-z0-9_:-]+)' parity/tables.yaml | sed 's/repo=//' | sort -u | wc -l"
    cwd: repo
    expect: 40
  - command: "sed -n '/pub const IMPLEMENTED_REPOSITORIES/,/^];/p' crates/openbot-infra/src/repo/mod.rs | grep -oE '\"openbot-infra::[^\"]+Repo\"' | tr -d '\"' | sort -u | wc -l"
    cwd: repo
    expect: 40
  - command: "comm -23 <(grep -oE 'repo=([A-Za-z0-9_:-]+)' parity/tables.yaml | sed 's/repo=//' | sort -u) <(sed -n '/pub const IMPLEMENTED_REPOSITORIES/,/^];/p' crates/openbot-infra/src/repo/mod.rs | grep -oE '\"openbot-infra::[^\"]+Repo\"' | tr -d '\"' | sort -u) | wc -l"
    cwd: repo
    expect: 0
  - command: "comm -13 <(grep -oE 'repo=([A-Za-z0-9_:-]+)' parity/tables.yaml | sed 's/repo=//' | sort -u) <(sed -n '/pub const IMPLEMENTED_REPOSITORIES/,/^];/p' crates/openbot-infra/src/repo/mod.rs | grep -oE '\"openbot-infra::[^\"]+Repo\"' | tr -d '\"' | sort -u) | wc -l"
    cwd: repo
